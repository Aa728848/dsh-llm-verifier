name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # pnpm 10+ feature: pnpm-workspace.yaml carries
          # `minimumReleaseAgeExclude` (supply-chain release-age policy).
          # pnpm 9 does not recognise that key, fails to parse the file, and
          # then reports the misleading "packages field missing or empty" for
          # every command including `pnpm store path`. Pin the major the
          # lockfile and workspace config actually require.
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm pack --dry-run
