name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # `cache: pnpm` makes setup-node shell out to `pnpm store path`, which
          # aborts here with "packages field missing or empty": no
          # pnpm-workspace.yaml exists, so pnpm resolves no packages and the
          # store query fails. This failed on BOTH matrices, so the whole CI
          # pipeline was red before a single test ran. Caching a single-install
          # pipeline is not worth an implicit dependency on pnpm's store layout.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm pack --dry-run
